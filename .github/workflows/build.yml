name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check for sorry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject sorry in VectorFieldMethod/
        run: scripts/check-no-sorry.sh

      - name: Build with Lake (Mathlib from the olean cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"
